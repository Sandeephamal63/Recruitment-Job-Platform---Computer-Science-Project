server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API calls keep their /api prefix (no trailing-slash rewrite on proxy_pass),
    # which matches the SPA's relative axios baseURL "http://localhost:8080/api".
    location /api/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # matching cold model load can exceed 60s
    }

    # SPA fallback: any non-file route serves index.html.
    location / {
        try_files $uri /index.html;
    }
}